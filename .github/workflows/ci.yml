name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest

  typescript-golden:
    name: TypeScript golden vectors
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install TypeScript dependencies
        working-directory: typescript
        run: npm install

      - name: Build TypeScript
        working-directory: typescript
        run: npm run build

      - name: Verify golden vectors
        working-directory: typescript
        run: npm run verify:golden

  docs-encoding:
    name: Documentation encoding guard
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Markdown for mojibake markers
        run: |
          python - <<'PY'
          from pathlib import Path

          suspicious = ["\ufffd", "??", "\uc9e0", "\uc9f9", "\uc9f8"]
          failures = []

          for path in Path(".").rglob("*.md"):
              if ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              for marker in suspicious:
                  if marker in text:
                      failures.append(f"{path}: contains {marker!r}")

          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          PY
