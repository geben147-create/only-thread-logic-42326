name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest

  typescript-golden:
    name: TypeScript golden vectors
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install TypeScript dependencies
        working-directory: typescript
        run: npm install

      - name: Build TypeScript
        working-directory: typescript
        run: npm run build

      - name: Verify golden vectors
        working-directory: typescript
        run: npm run verify:golden

  docs-encoding:
    name: Documentation encoding guard
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Markdown for mojibake markers
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          # Match what corruption actually looks like, not individual Hangul
          # syllables. The previous list flagged three ordinary Korean syllables
          # used in counting ("second", "first"), so every real doc failed.
          checks = [
              ("U+FFFD replacement char", re.compile("\ufffd")),
              # UTF-8 read as Latin-1: a lead byte lands in C0-FF followed by a
              # continuation byte in 80-BF. Ordinary accented text never matches.
              ("Latin-1 mojibake", re.compile(r"[\u00c0-\u00ff][\u0080-\u00bf]")),
              # C1 control characters never belong in a Markdown document.
              ("C1 control char", re.compile(r"[\u0080-\u009f]")),
              # Classic CP949 mojibake signature.
              ("CP949 mojibake sequence", re.compile("\u5360\uc3d9\uc619")),
          ]
          failures = []

          for path in Path(".").rglob("*.md"):
              if ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              for label, pattern in checks:
                  match = pattern.search(text)
                  if match:
                      line = text[: match.start()].count("\n") + 1
                      failures.append(f"{path}:{line}: {label} -> {match.group()!r}")

          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          PY
